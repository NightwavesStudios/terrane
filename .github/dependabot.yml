version: 2

# The app has three runtime dependencies and the map provider is deliberately
# pinned (see README, "Why MapLibre is held at v5"), so a major bump is a decision
# rather than a merge. Minor and patch updates go through CI like any other PR.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
