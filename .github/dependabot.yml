version: 2

# The app has three runtime dependencies and the map provider is deliberately
# pinned, so a major bump is a decision rather than a merge. Minor and patch
# updates go through CI like any other PR.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      # Deliberately held at v5; a v6 bump is a mapping decision, not a
      # dependency chore.
      - dependency-name: "maplibre-gl"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
