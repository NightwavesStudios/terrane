name: data weekly

# Sites cannot run Python or cron, so the open-data refresh lives here.
# One run: OSM POIs (resumable), every agency adapter, the merge, the manifest,
# the coverage gate and a hash-diff upload. A silent zero fails the job.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: terrane-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      POI_BUCKET: ${{ secrets.POI_BUCKET }}
      POI_UPLOAD_TOKEN: ${{ secrets.POI_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check osmium
      - run: npm ci
      - run: node scripts/fetch-source-state.mjs

      # Resumable: a stopped run picks up at the first extract without rows.
      - run: python3 scripts/harvest-poi-bulk.py --deadline=18000
      - run: python3 scripts/harvest-poi-bulk.py --merge --allow-partial

      - run: python3 scripts/sources/ridb.py
      - run: python3 scripts/sources/usfs.py sites
      - run: python3 scripts/sources/blm.py sites
      - run: python3 scripts/sources/nps.py
      - run: python3 scripts/sources/usfs.py trails
      - run: python3 scripts/sources/blm.py trails
      - run: python3 scripts/sources/national.py
      - run: python3 scripts/sources/parks_canada.py

      - run: python3 scripts/merge-sources.py
      - run: node scripts/poi-stats.mjs
      - run: node scripts/dedupe-report.mjs
      - run: node scripts/build-manifest.mjs
      - run: node scripts/coverage-report.mjs --strict
      - run: node scripts/validate-data.mjs
      - run: node scripts/upload-changed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            reports/coverage.md
            reports/coverage.json
            reports/merge.json
