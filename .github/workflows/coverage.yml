name: coverage

# Publishing the gap register is part of the store, so it gets its own job. It
# reads the source manifests the data workflows leave in the bucket and never
# touches cells.
on:
  workflow_dispatch:
  schedule:
    - cron: "9 7 * * *"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POI_BUCKET: ${{ secrets.POI_BUCKET }}
      POI_UPLOAD_TOKEN: ${{ secrets.POI_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-source-state.mjs
      - run: node scripts/coverage-report.mjs
      # This job never runs build-manifest, so it must not upload a manifest: the
      # checkout's copy is older than the one the last data job published.
      - run: node scripts/upload-changed.mjs --skip-manifest
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: reports/coverage.md
