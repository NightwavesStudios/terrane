name: data monthly trails

on:
  schedule:
    - cron: "23 4 2 * *"
  workflow_dispatch:

concurrency:
  group: terrane-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trails:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      POI_BUCKET: ${{ secrets.POI_BUCKET }}
      POI_UPLOAD_TOKEN: ${{ secrets.POI_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: node scripts/fetch-source-state.mjs
      # OSM hiking routes are ~68% of the trail store (330k of 486k segments).
      # The checkout has no rows, so without this harvest the merge below would
      # rebuild trails from the three agency feeds alone and the strict gate
      # would refuse the run — correctly, but the job could never go green.
      - run: python3 scripts/sources/osm_routes_global.py --workers 3
      - run: python3 scripts/sources/nps.py
      - run: python3 scripts/sources/usfs.py trails
      - run: python3 scripts/sources/blm.py trails
      - run: python3 scripts/merge-sources.py
      # The gate reads the cells the merge just wrote. It must run before the
      # manifest, because it also writes the quality block the app validates.
      - run: node scripts/trail-quality.mjs --strict
      - run: node --max-old-space-size=6144 scripts/build-trail-links.mjs
      - run: node scripts/build-manifest.mjs
      - run: node scripts/coverage-report.mjs --strict
      - run: node scripts/upload-changed.mjs
