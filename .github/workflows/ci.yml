name: ci

# The gate a deploy has to pass. It runs exactly what `npm run build` runs, plus
# the unit tests, so a green check means Vercel is building something that
# typechecks, validates its data and still produces a sitemap matching the atlas.
#
# Everything here is offline: the data files are committed and the build needs no
# secrets, so this workflow runs on forks too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: unit tests
        run: npm test

      # The build runs the data generators, validation and typecheck before
      # Vite; keeping it one step avoids doing those checks twice. It writes
      # absolute canonical/og:url and sitemap values when SITE_URL is set, and
      # the documented placeholder origin when it is not, so the artifact
      # always carries a complete route set.
      - name: build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
