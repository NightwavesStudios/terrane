name: experience-sources

# Opt-in networked check. The normal CI gate and build read the committed
# `src/data/experience-sources.json` artifact and never touch the network; this
# workflow re-fetches every distinct source URL and fails if a shipped link is
# confirmed dead. Run it manually after a data refresh, then commit the artifact
# it writes (the workflow only reports; it does not push).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: verify experience source links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `--write` refreshes the artifact only when the run is complete enough to
      # trust; `--strict` fails on any confirmed dead link.
      - name: check source links
        run: npm run sources:check
