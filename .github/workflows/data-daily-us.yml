name: data daily us

# Recreation.gov publishes a full export every day. It is the one agency source
# worth a daily cadence; the monthly workflows keep the rest current.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

concurrency:
  group: terrane-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ridb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POI_BUCKET: ${{ secrets.POI_BUCKET }}
      POI_UPLOAD_TOKEN: ${{ secrets.POI_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: node scripts/fetch-source-state.mjs
      - run: python3 scripts/sources/ridb.py
      - run: python3 scripts/merge-sources.py --points-only
      - run: node scripts/build-manifest.mjs
      - run: node scripts/coverage-report.mjs
      - run: node scripts/upload-changed.mjs
