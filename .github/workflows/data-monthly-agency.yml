name: data monthly agency

on:
  schedule:
    - cron: "53 4 3 * *"
  workflow_dispatch:

concurrency:
  group: terrane-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agency:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      POI_BUCKET: ${{ secrets.POI_BUCKET }}
      POI_UPLOAD_TOKEN: ${{ secrets.POI_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: node scripts/fetch-source-state.mjs
      - run: python3 scripts/sources/usfs.py sites
      - run: python3 scripts/sources/blm.py sites
      - run: python3 scripts/sources/national.py
      - run: python3 scripts/sources/parks_canada.py
      - run: python3 scripts/merge-sources.py --points-only
      - run: node scripts/build-manifest.mjs
      # Strict on every job that publishes: a zero or missing source must stop
      # the run before the upload, not publish a manifest claiming zero records.
      - run: node scripts/coverage-report.mjs --strict
      - run: node scripts/upload-changed.mjs
