<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070c" />

    <title>Terrane — a globe of places worth going outside for</title>
    <meta
      name="description"
      content="Spin a globe of peaks, parks, landmarks, campsites, water and parking. Real coordinates, shaded terrain and hiking trails, in one category list."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="__SITE_URL__/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Terrane" />
    <meta property="og:title" content="Terrane — a globe of places worth going outside for" />
    <meta
      property="og:description"
      content="Peaks, parks, landmarks and the places you stay, drink and park, on one shaded globe. Click a point, read what is around it."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Terrane globe over the Alps at sunset, with hiking trails drawn in gold." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Terrane — a globe of places worth going outside for" />
    <meta
      name="twitter:description"
      content="Peaks, parks, landmarks and the places you stay, drink and park on one shaded globe."
    />
    <meta name="twitter:image" content="__SITE_URL__/og.jpg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="stylesheet" href="/fonts.css" />
    <!-- The three faces the globe actually paints with, latin subset only. Sora
         sets the wordmark and nav, Plus Jakarta the caption, JetBrains Mono the
         small caps — preloading them removes the swap flash on first paint.
         Fraunces (the place page's serif) is deliberately not preloaded. -->
    <link rel="preload" href="/fonts/f5.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/f9.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/f15.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Vector tiles + glyphs, the terrain DEM, and the location lookup. Warming
         DNS and TLS here means the first tile request does not queue behind a
         handshake. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preconnect" href="https://tiles.mapterhorn.com" crossorigin />
    <link rel="dns-prefetch" href="https://ipwho.is" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Terrane",
        "url": "__SITE_URL__/",
        "description": "An interactive globe of peaks, national parks, landmarks, campsites, water and parking, with shaded terrain and hiking trails.",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
